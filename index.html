<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/beamcut-web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Beamcut — раскрой профиля, трубы, уголка, бруса онлайн: минимальный отход, учёт пропила и торцовки, склад деловых остатков, PDF-карта раскроя.">
  <meta name="theme-color" content="#101215">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Beamcut">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Beamcut — раскрой металла и дерева</title>
  <script>
    // pdf.js для просмотра PDF берём со своего сайта, а не с внешнего CDN.
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #101215; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font: 500 15px system-ui, sans-serif; color: #8e95a3; transition: opacity .3s; }
    #boot svg { width: 72px; height: 72px; }
    #boot .bar { width: 160px; height: 3px; background: #23272c; border-radius: 3px; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; background: #FFB020; animation: run 1.1s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 48 48"><path d="M8 8h32v7H27.5v18H40v7H8v-7h12.5V15H8z" fill="#FFB020"/></svg>
    <div class="bar"><i></i></div>
    <div>Загрузка Beamcut…</div>
  </div>
  <noscript><p style="color:#fff;font-family:sans-serif;text-align:center">Для работы Beamcut включите JavaScript.</p></noscript>
  <script>
    // Убираем заставку, когда Flutter нарисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = 0; setTimeout(function () { b.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
